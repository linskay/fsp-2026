server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: fsp-career-arena-backend
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fsp_career_db}
    username: ${SPRING_DATASOURCE_USERNAME:fsp_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:fsp_secure_password_2026}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID:mock-github-client-id}
            client-secret: ${GITHUB_CLIENT_SECRET:mock-github-client-secret}
            scope: read:user,user:email,public_repo
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
          yandex:
            client-id: ${YANDEX_CLIENT_ID:mock-yandex-client-id}
            client-secret: ${YANDEX_CLIENT_SECRET:mock-yandex-client-secret}
            scope: login:email,login:info
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
          hh:
            client-id: ${HH_CLIENT_ID:mock-hh-client-id}
            client-secret: ${HH_CLIENT_SECRET:mock-hh-client-secret}
            scope: default
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          yandex:
            authorization-uri: https://oauth.yandex.ru/authorize
            token-uri: https://oauth.yandex.ru/token
            user-info-uri: https://login.yandex.ru/info
            user-name-attribute: id
          hh:
            authorization-uri: https://hh.ru/oauth/authorize
            token-uri: https://hh.ru/oauth/token
            user-info-uri: https://api.hh.ru/me
            user-name-attribute: id

# External Services
integrations:
  leetcode:
    graphql-url: https://leetcode.com/graphql
  judge0:
    api-url: ${JUDGE0_API_URL:https://judge0-ce.p.rapidapi.com}
    api-key: ${JUDGE0_API_KEY:mock-judge0-key}
  ai:
    provider: ${AI_PROVIDER:gemini}
    gemini:
      api-key: ${GEMINI_API_KEY:AQ.Ab8RN6Kclff0cT3KZgjHJj_h4MgUMqyofqe-VvfDiqhbNekiMg}
      api-url: ${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/openai/chat/completions}
      model: ${GEMINI_MODEL:gemini-1.5-flash}
    openrouter:
      api-key: ${OPENROUTER_API_KEY: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}
      api-url: ${OPENROUTER_API_URL:https://openrouter.ai/api/v1/chat/completions}
      model: ${OPENROUTER_MODEL:meta-llama/llama-3.1-8b-instruct:free}
    ollama:
      api-url: ${OLLAMA_API_URL:http://ollama:11434/v1/chat/completions}
      model: ${OLLAMA_MODEL:llama3:8b}
    yandex:
      api-key: ${YANDEX_API_KEY:${AI_API_KEY:mock-ai-key}}
      folder-id: ${YANDEX_FOLDER_ID:b1gmockfolderid}
      api-url: ${YANDEX_API_URL:https://llm.api.cloud.yandex.net/foundationModels/v1/completion}
      model: ${YANDEX_MODEL:yandexgpt}
